# Industry Art para iPhone y iPad. Genera el proyecto de Xcode con XcodeGen:
#   brew install xcodegen && cd industry-art/ios && xcodegen
# El juego es ../index.html (el mismo archivo que va en la app Android y en la web).
name: IndustryArt
options:
  bundleIdPrefix: com.onezero
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "18"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
targets:
  IndustryArt:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: IndustryArt
      - path: ../index.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onezero.industryart
        PRODUCT_NAME: IndustryArt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    info:
      path: IndustryArt/Info.plist
      properties:
        CFBundleDisplayName: Industry Art
        CFBundleName: Industry Art
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: Fondo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.onezero.industryart.iasave
            UTTypeDescription: Partida de Industry Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [iasave]
          - UTTypeIdentifier: com.onezero.industryart.iaestudio
            UTTypeDescription: Estudio de Industry Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [iaestudio]
          - UTTypeIdentifier: com.onezero.industryart.iataller
            UTTypeDescription: Historia del Taller de Industry Art
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [iataller]
